<?xml version="1.0"?>
<html:div xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
          xmlns:html="http://www.w3.org/1999/xhtml">

  <groupbox>
    <label><html:h2>ZotDupe — Semantic Duplicate Detector</html:h2></label>

    <html:div style="padding: 8px;">
      <label value="Threshold preset:" />
      <menulist id="zotdupe-pref-threshold" preference="extensions.zotdupe.thresholdPreset">
        <menupopup>
          <menuitem label="Strict (≥ 0.85)" value="strict" />
          <menuitem label="Balanced (≥ 0.75)" value="balanced" />
          <menuitem label="Relaxed (≥ 0.60)" value="relaxed" />
        </menupopup>
      </menulist>
    </html:div>

    <html:div style="padding: 8px;">
      <checkbox id="zotdupe-pref-legal"
                label="Enable legal fingerprint matching (ISBN, DOI, PMID)"
                preference="extensions.zotdupe.legalFingerprint" />
    </html:div>

    <html:div style="padding: 8px;">
      <checkbox id="zotdupe-pref-preprint"
                label="Detect preprint → published article pairs"
                preference="extensions.zotdupe.detectPreprint" />
    </html:div>

    <html:div style="padding: 8px;">
      <checkbox id="zotdupe-pref-crosstype"
                label="Match across item types (conference vs. journal, etc.)"
                preference="extensions.zotdupe.crossType" />
    </html:div>

    <html:div style="padding: 8px;">
      <checkbox id="zotdupe-pref-minhash"
                label="Use MinHash LSH for large libraries (approximate matching)"
                preference="extensions.zotdupe.minhash" />
    </html:div>
  </groupbox>

</html:div>
