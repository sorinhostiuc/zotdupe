<?xml version="1.0"?>
<?xml-stylesheet href="report-dialog.css" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        title="ZotDupe — Report"
        width="560" height="500"
        onload="ZotDupeReport.init();">

  <html:div id="zotdupe-report-root">

    <!-- Header -->
    <html:div id="zotdupe-report-header">
      <html:div id="zotdupe-report-checkmark">
        <html:svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
          <html:circle cx="24" cy="24" r="22" fill="#388E3C"/>
          <html:polyline points="14,25 21,32 34,18" fill="none" stroke="#FFFFFF" stroke-width="3.5"
                         stroke-linecap="round" stroke-linejoin="round"/>
        </html:svg>
      </html:div>
      <html:span id="zotdupe-report-title">Scan Complete</html:span>
    </html:div>

    <!-- Summary card -->
    <html:div id="zotdupe-report-card">

      <!-- Scan stats -->
      <html:div class="zotdupe-report-row">
        <html:span class="zotdupe-report-label">Items scanned</html:span>
        <html:span class="zotdupe-report-value" id="zotdupe-stat-scanned">0</html:span>
      </html:div>
      <html:div class="zotdupe-report-row">
        <html:span class="zotdupe-report-label">Clusters detected</html:span>
        <html:span class="zotdupe-report-value" id="zotdupe-stat-clusters">0</html:span>
      </html:div>

      <html:hr class="zotdupe-report-sep"/>

      <!-- Merge stats -->
      <html:div class="zotdupe-report-row">
        <html:span class="zotdupe-report-label">Merges performed</html:span>
        <html:span class="zotdupe-report-value zotdupe-val-green" id="zotdupe-stat-merges">0</html:span>
      </html:div>
      <html:div class="zotdupe-report-row">
        <html:span class="zotdupe-report-label">Marked as non-duplicate</html:span>
        <html:span class="zotdupe-report-value zotdupe-val-gray" id="zotdupe-stat-nondup">0</html:span>
      </html:div>
      <html:div class="zotdupe-report-row">
        <html:span class="zotdupe-report-label">Unresolved (skipped)</html:span>
        <html:span class="zotdupe-report-value zotdupe-val-amber" id="zotdupe-stat-skipped">0</html:span>
      </html:div>

      <html:hr class="zotdupe-report-sep"/>

      <!-- Preservation stats -->
      <html:div class="zotdupe-report-row">
        <html:span class="zotdupe-report-label">Fields saved in Extra</html:span>
        <html:span class="zotdupe-report-value zotdupe-val-blue" id="zotdupe-stat-extra">0</html:span>
      </html:div>
      <html:div class="zotdupe-report-row">
        <html:span class="zotdupe-report-label">Attachments preserved</html:span>
        <html:span class="zotdupe-report-value" id="zotdupe-stat-attachments">0</html:span>
      </html:div>
      <html:div class="zotdupe-report-row">
        <html:span class="zotdupe-report-label">Tags merged</html:span>
        <html:span class="zotdupe-report-value" id="zotdupe-stat-tags">0 unique tags</html:span>
      </html:div>

      <html:hr class="zotdupe-report-sep"/>

      <!-- Timing -->
      <html:div class="zotdupe-report-row">
        <html:span class="zotdupe-report-label">Scan time</html:span>
        <html:span class="zotdupe-report-value" id="zotdupe-stat-scantime">0.0s</html:span>
      </html:div>
      <html:div class="zotdupe-report-row">
        <html:span class="zotdupe-report-label">Total merge time</html:span>
        <html:span class="zotdupe-report-value" id="zotdupe-stat-mergetime">0.0s</html:span>
      </html:div>

    </html:div>

    <!-- Footer buttons -->
    <html:div id="zotdupe-report-footer">
      <html:button id="zotdupe-btn-export" onclick="ZotDupeReport.onExportCSV();">Export CSV report</html:button>
      <html:button id="zotdupe-btn-close" onclick="ZotDupeReport.onClose();">Close</html:button>
    </html:div>

  </html:div>

  <script src="report-dialog.js"/>
</window>
