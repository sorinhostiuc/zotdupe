name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: for test in zotdupe/tests/test-*.js; do node "$test"; done
      - name: Build XPI
        run: bash zotdupe/build.sh
      - name: Generate update manifest
        run: node scripts/generate-update.mjs "zotdupe-$(node -p "require('./zotdupe/manifest.json').version").xpi"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" zotdupe-*.xpi update.json --generate-notes
